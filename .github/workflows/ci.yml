
name: CPMS CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Project Structure
        run: |
          test -f student/registration.txt
          test -f company/company.txt
          test -f placement/drive.txt
          echo "CPMS project files verified."

  test:
    name: Automated Testing
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run CPMS Tests
        id: tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-report.txt

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpms-test-report
          path: test-report.txt
          if-no-files-found: ignore

      - name: Publish Pipeline Summary
        if: always()
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          echo "# CPMS CI Pipeline Report" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test status: $TEST_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: Mainframe Automated Storage Management System" >> "$GITHUB_STEP_SUMMARY"
